
name: Iris MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run automated tests
      - name: Run Pytest
        run: |
          python -m pytest tests/ -v

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/iris-mlops-api:latest .

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-mlops-api:latest

      # 7. Deploy to Linux VM
      - name: Deploy to Remote Linux VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/iris-mlops-api:latest

            docker stop iris-api || true
            docker rm iris-api || true

            docker run -d \
              --restart unless-stopped \
              -p 8000:8000 \
              --name iris-api \
              ${{ secrets.DOCKERHUB_USERNAME }}/iris-mlops-api:latest

            docker ps
